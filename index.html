<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body {
            display: flex;
            justify-content: center;   /* horizontal center */
            align-items: center;       /* vertical center */
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
        }
        .container {
            text-align: center;
            border: 2px solid #333;
            padding: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
            width: 350px;
        }
        input, button {
            margin: 5px;
            padding: 8px;
            width: 80%;
            border-radius: 4px;
            border: 1px solid #aaa;
        }
        button {
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function calculateSum() {
            let hra = parseFloat(document.getElementById("hra").value) || 0;
            let ta  = parseFloat(document.getElementById("ta").value) || 0;
            let da  = parseFloat(document.getElementById("da").value) || 0;

            let total = hra + ta + da;

            // Get first name, last name, and designation
            let firstName = document.querySelector('[name="first_name"]').value;
            let lastName  = document.querySelector('[name="last_name"]').value;
            let designation = document.querySelector('[name="designation"]').value;

            // Add "Mr" before first name
            let fullName = "Mr " + firstName + " " + lastName;

            // Show result
            document.getElementById("sumResult").innerHTML = 
                "<p><b>Name:</b> " + fullName + "</p>" +
                "<p><b>Designation:</b> " + designation + "</p>" +
                "<p><b>Total (HRA + TA + DA):</b> " + total + "</p>";
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>DETAILS</h1>   

        <form action="http://127.0.0.1:8000/process_post" method="POST">
            <input type="text" name="first_name" placeholder="First Name"><br>
            <input type="text" name="last_name" placeholder="Last Name"><br>
            <input type="text" name="sal" placeholder="Basic Salary"><br>
            <input type="text" id="hra" name="hra" placeholder="HRA"><br>
            <input type="text" id="ta" name="ta" placeholder="TA"><br>
            <input type="text" id="da" name="da" placeholder="DA"><br>
            <input type="text" name="designation" placeholder="Designation"><br>

            <input type="submit" value="Submit">
            <button type="button" onclick="calculateSum()">Calculate Sum</button>
        </form>

        <div id="sumResult" style="font-weight:bold; color:blue; margin-top:15px;"></div>
    </div>
</body>
</html>
